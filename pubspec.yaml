name: ogrenci_takip_rapor
description: Teacher dashboard and reports stored only on this device.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: UyghurFont
      fonts:
        - asset: assets/fonts/UyghurFont.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/UyghurFont.ttf
